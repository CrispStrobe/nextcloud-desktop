name: Delta Sync Compile Check
on:
  push:
    branches: [delta-sync]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    name: Linux GCC compile (delta-sync)
    runs-on: ubuntu-latest
    container: ghcr.io/nextcloud/continuous-integration-client-qt6:client-sid-6.10.2-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_MAJOR_VERSION=6 \
            -DQUICK_COMPILER=ON \
            -DBUILD_UPDATER=ON \
            -DBUILD_TESTING=1 \
            -DCMAKE_CXX_FLAGS=-Werror

      - name: Compile
        run: cd build && ninja

      - name: Run tests
        run: |
          cd build
          useradd -m -s /bin/bash test
          chown -R test:test .
          su -c 'xvfb-run ctest --output-on-failure' test
